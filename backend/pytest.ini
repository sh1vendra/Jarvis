[pytest]
# Run from backend/ (`cd backend && pytest`, or via the Makefile targets in
# the repo root). `pythonpath` puts backend/ itself on sys.path so tests
# import the app exactly the way it imports itself (`from agents.action
# import action_agent`, `from tools.mac_control import ...`) rather than
# needing a package install.
pythonpath = .

# Fast, no-real-Mac-state, no-network suite by default - testpaths only
# covers tests/unit. Integration tests (tests/integration/) are never
# collected by a bare `pytest` invocation; run them explicitly (see
# README/Makefile) since they touch real Reminders/Spotify state or make a
# real Gemini call.
testpaths = tests/unit

markers =
    integration: exercises real state outside this process - the real macOS Reminders/Spotify apps, a real screen capture, or a real Gemini API call. Slower, needs the real local environment and (for LLM-backed tests) GOOGLE_API_KEY. Not run by a bare `pytest` - see tests/integration/ and the README.

asyncio_mode = auto

# Fail loudly on an unregistered marker (a typo'd @pytest.mark.integraton
# would otherwise just silently do nothing) rather than a warning easy to
# miss in a long run's output.
addopts = --strict-markers
